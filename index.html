<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>Tic Tac Toe</title>
  </head>

  <body>
    <div class="game">
      <div class="title"><span>X O</span> Game</div>
      <div class="square" id="item1" onclick="playerMove(1)"></div>
      <div class="square" id="item2" onclick="playerMove(2)"></div>
      <div class="square" id="item3" onclick="playerMove(3)"></div>

      <div class="square" id="item4" onclick="playerMove(4)"></div>
      <div class="square" id="item5" onclick="playerMove(5)"></div>
      <div class="square" id="item6" onclick="playerMove(6)"></div>

      <div class="square" id="item7" onclick="playerMove(7)"></div>
      <div class="square" id="item8" onclick="playerMove(8)"></div>
      <div class="square" id="item9" onclick="playerMove(9)"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
